[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-claim-verifier"
version = "0.6.0"
description = "Tool-backed verification of LLM security triage claims against source code"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Ugo Giordano"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["security", "llm", "verification", "hallucination", "triage", "claims"]

[project.urls]
Homepage = "https://github.com/ugiordan/code-claim-verifier"
Repository = "https://github.com/ugiordan/code-claim-verifier"

[project.optional-dependencies]
anthropic = ["anthropic>=0.20"]
openai = ["openai>=1.0"]
test = ["pytest>=7.0", "httpx>=0.24", "requests>=2.0"]
lint = ["ruff>=0.15,<0.16"]

[project.scripts]
ccv = "code_claim_verifier.cli:main"

[tool.setuptools]
packages = [
    "code_claim_verifier",
    "code_claim_verifier.eval",
    "code_claim_verifier.providers",
    "code_claim_verifier.verifiers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"eval/cybergym/*.py" = ["E402"]
"eval/multiswe/*.py" = ["E402"]
